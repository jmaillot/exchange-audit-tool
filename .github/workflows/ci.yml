name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: dotnet build ExchangeAuditTool.sln -c Release

      - name: Test
        shell: powershell
        run: dotnet test ExchangeAuditTool.sln -c Release --no-build
