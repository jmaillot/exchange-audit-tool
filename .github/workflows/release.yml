name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: ./Build-ExchangeAuditTool.ps1

      - name: Version check (tag vs AssemblyFileVersion, warning only)
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content -LiteralPath "src/ExchangeAuditTool/Program.cs" -Raw
          $m = [regex]::Match($text, 'AssemblyFileVersion\("([0-9]+(?:\.[0-9]+){1,3})"\)')
          $fileVersion = if ($m.Success) { $m.Groups[1].Value -replace '^(\d+\.\d+\.\d+)\.\d+$', '$1' } else { "" }
          Write-Host "Tag version: $tag"
          Write-Host "AssemblyFileVersion: $fileVersion"
          if ($fileVersion -and $tag -ne $fileVersion) {
            Write-Warning "Version mismatch: tag '${{ github.ref_name }}' does not match AssemblyFileVersion '$fileVersion' in Program.cs."
          }

      - name: List dist
        shell: powershell
        run: Get-ChildItem dist

      - name: Suffix prerelease exe with tag (builds stay distinguishable)
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag.Contains("-")) {
            Get-ChildItem dist/*.exe | ForEach-Object {
              $leaf = $_.Name -replace '\.exe$', "-$tag.exe"
              Rename-Item -LiteralPath $_.FullName -NewName $leaf
            }
          }
          Get-ChildItem dist

      - name: Checksum (SHA256)
        shell: powershell
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath ($_.FullName + ".sha256") -Encoding ascii
          }
          Get-ChildItem dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
